name: ${COMPOSE_PROJECT_NAME:-eland-tutorial-v9}

services:
  backend-es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:?Run python3 scripts/init_env.py first}
    user: "0"
    entrypoint: ["/bin/bash", "/setup-certs.sh"]
    environment:
      STACK_VERSION: ${STACK_VERSION}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:-}
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - ./docker/setup-certs.sh:/setup-certs.sh:ro
    mem_limit: 1g

  backend-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    depends_on:
      backend-es-setup:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      node.name: elasticsearch
      cluster.name: ${CLUSTER_NAME:-eland-tutorial}
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Generate passwords with scripts/init_env.py}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:-}
      bootstrap.memory_lock: "true"
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.key: certs/elasticsearch/elasticsearch.key
      xpack.security.http.ssl.certificate: certs/elasticsearch/elasticsearch.crt
      xpack.security.http.ssl.certificate_authorities: certs/ca/ca.crt
      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.key: certs/elasticsearch/elasticsearch.key
      xpack.security.transport.ssl.certificate: certs/elasticsearch/elasticsearch.crt
      xpack.security.transport.ssl.certificate_authorities: certs/ca/ca.crt
      xpack.security.transport.ssl.verification_mode: certificate
      xpack.license.self_generated.type: basic
    volumes:
      - certs:/usr/share/elasticsearch/config/certs:ro
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:${ES_PORT:-9200}:9200"
    mem_limit: ${ES_MEM_LIMIT:-2g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --max-time 8
          --cacert config/certs/ca/ca.crt
          --user "elastic:$${ELASTIC_PASSWORD}"
          'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'
          > /dev/null
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  backend-kibana-setup:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    depends_on:
      backend-elasticsearch:
        condition: service_healthy
    entrypoint: ["/usr/share/kibana/node/default/bin/node", "/setup-kibana.mjs"]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:?Generate passwords with scripts/init_env.py}
    volumes:
      - certs:/usr/share/kibana/config/certs:ro
      - ./docker/setup-kibana.mjs:/setup-kibana.mjs:ro
    mem_limit: 256m

  backend-kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    depends_on:
      backend-kibana-setup:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      SERVER_HOST: 0.0.0.0
      ELASTICSEARCH_HOSTS: https://backend-elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD}
      ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES: /usr/share/kibana/config/certs/ca/ca.crt
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_SECURITY_KEY:?Run scripts/init_env.py to generate encryption keys}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_SAVED_OBJECTS_KEY:?Run scripts/init_env.py to generate encryption keys}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_REPORTING_KEY:?Run scripts/init_env.py to generate encryption keys}
    volumes:
      - certs:/usr/share/kibana/config/certs:ro
      - kibanadata:/usr/share/kibana/data
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    mem_limit: ${KIBANA_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 8 http://localhost:5601/api/status > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

volumes:
  certs:
  esdata:
  kibanadata:
