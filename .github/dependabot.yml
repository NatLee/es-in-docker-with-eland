version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      tutorial-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    # Major upgrades need a coordinated Stack/Eland/Python compatibility review.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # NumPy 2.5+ requires Python >=3.12; this tutorial still supports 3.11.
      # Revisit this ceiling when the documented Python minimum changes.
      - dependency-name: numpy
        versions: [">=2.5"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
